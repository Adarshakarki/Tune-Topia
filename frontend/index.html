<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <title>Topia Tune</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <h1 class="app-title">Topia Tune</h1>
            <div class="header-accent"></div>
        </header>

        <!-- Loading indicator -->
        <div id="loading" class="loading-overlay">
            <div class="loading-spinner"></div>
            <p>Initializing player...</p>
        </div>

        <!-- Main content -->
        <main class="main-content">
            <!-- Now Playing Section -->
            <section class="now-playing-section">
                <div id="current-song" class="now-playing-card">
                    <div class="now-playing-placeholder">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                        <span>Select a song to start</span>
                    </div>
                </div>

                <!-- Playback Controls -->
                <div id="controls" class="playback-controls" style="display: none;">
                    <div class="progress-container">
                        <span id="current-time" class="time-display">0:00</span>
                        <div class="progress-bar">
                            <div id="progress-fill" class="progress-fill"></div>
                        </div>
                        <span id="duration" class="time-display">0:00</span>
                    </div>
                    
                    <div class="control-buttons">
                        <button id="prev-btn" class="control-btn" title="Previous">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                            </svg>
                        </button>
                        <button id="play-pause-btn" class="control-btn primary" title="Play/Pause">
                            <svg id="play-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                                <polygon points="5 3 19 12 5 21 5 3"></polygon>
                            </svg>
                            <svg id="pause-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                                <rect x="6" y="4" width="4" height="16"></rect>
                                <rect x="14" y="4" width="4" height="16"></rect>
                            </svg>
                        </button>
                        <button id="next-btn" class="control-btn" title="Next">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M16 18h2V6h-2zm-11-6l8.5-6v12z"/>
                            </svg>
                        </button>
                        <div class="volume-control">
                            <button id="volume-btn" class="control-btn" title="Volume">
                                <svg id="volume-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                                </svg>
                            </button>
                            <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="100">
                        </div>
                    </div>
                </div>
            </section>

            <!-- Song List Section -->
            <section class="song-list-section">
                <h2 class="section-title">Your Library</h2>
                <div id="song-list" class="song-grid"></div>
            </section>
        </main>

        <!-- Hidden YT player -->
        <div id="player"></div>
    </div>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
