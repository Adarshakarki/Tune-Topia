<div class="page-search">
  <div class="view-header">
    <h1 class="view-title">Search</h1>
    <div class="search-bar">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input id="q" type="text" placeholder="Artists, songs, or podcasts" autocomplete="off"/>
      <button id="go" class="search-go">Search</button>
    </div>
  </div>

  <!-- Genre chips (shown before any search) -->
  <div id="genre-shelf">
    <div class="section-header">
      <span class="section-title">Browse by genre</span>
    </div>
    <div class="hint-grid">
      <div class="hint-card" data-q="trending pop songs 2025"     style="--c:#fc3c44">🔥 Trending</div>
      <div class="hint-card" data-q="best rock songs"             style="--c:#2979ff">🎸 Rock</div>
      <div class="hint-card" data-q="smooth jazz"                 style="--c:#00897b">🎷 Jazz</div>
      <div class="hint-card" data-q="classical music"             style="--c:#f57c00">🎻 Classical</div>
      <div class="hint-card" data-q="popular pop music 2025"      style="--c:#8e24aa">🎤 Pop</div>
      <div class="hint-card" data-q="electronic music mix"        style="--c:#00acc1">🎧 Electronic</div>
      <div class="hint-card" data-q="hip hop hits"                style="--c:#ff6f00">🎙 Hip-Hop</div>
      <div class="hint-card" data-q="r&b soul music"              style="--c:#ad1457">💜 R&amp;B</div>
      <div class="hint-card" data-q="lofi hip hop study"          style="--c:#4caf50">🌿 Lo-Fi</div>
      <div class="hint-card" data-q="indie alternative music"     style="--c:#795548">🎵 Indie</div>
      <div class="hint-card" data-q="country music hits"          style="--c:#ff8f00">🤠 Country</div>
      <div class="hint-card" data-q="metal rock music"            style="--c:#424242">🤘 Metal</div>
    </div>
  </div>

  <!-- Results appear here after search -->
  <div id="search-results" style="display:none">
    <div class="section-header">
      <span class="section-title" id="results-label">Results</span>
    </div>
    <div class="results-grid" id="results-grid"></div>
  </div>
</div>

<script src="js/pages/search.js"></script>
