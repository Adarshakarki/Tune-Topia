<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#080810" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>TuneTopia</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">

  <div id="main">

    <!-- home -->
    <div id="page-home" class="page active">
      <div class="page-header">
        <div class="hero">
          <div class="hero-eyebrow">🎵 Discover Music</div>
          <div class="hero-title">Tune<span>Topia</span></div>
          <div class="hero-sub">TIDAL lossless · YouTube · All in one</div>
        </div>
        <div id="provider-pill"></div>
        <div class="chips-wrap">
          <div class="chips" id="genre-chips"></div>
        </div>
      </div>
      <div class="section">
        <div class="track-list" id="home-tracks"></div>
      </div>
    </div>

    <!-- search -->
    <div id="page-search" class="page">
      <div class="page-header">
        <div class="search-header">
          <div class="search-title">Search</div>
          <div class="search-bar-wrap">
            <div class="search-bar">
              <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" style="color:var(--subtext);flex-shrink:0"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
              <input id="search-input" type="text" placeholder="Artists, songs, albums…" autocomplete="off" spellcheck="false" />
              <button id="search-clear">
                <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
              </button>
            </div>
          </div>
          <div class="search-mode-wrap">
            <span class="search-mode-label">Source:</span>
            <select id="search-mode">
              <option value="auto">Auto (TIDAL → YT)</option>
              <option value="tidal">TIDAL only</option>
              <option value="youtube">YouTube only</option>
            </select>
          </div>
        </div>
      </div>
      <div class="section">
        <div class="track-list" id="search-results"></div>
      </div>
    </div>

    <!-- library -->
    <div id="page-library" class="page">
      <div class="page-header">
        <div class="library-header">
          <div class="library-title">Library</div>
        </div>
      </div>
      <div class="section">
        <div class="track-list" id="library-tracks"></div>
      </div>
    </div>

  </div>

  <!-- mini player -->
  <div id="mini-player" class="hidden">
    <img id="mini-art" src="" alt="" />
    <div id="mini-info">
      <div id="mini-title">—</div>
      <div id="mini-artist">—</div>
    </div>
    <button class="mini-ctrl" id="mini-prev-btn">
      <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
    </button>
    <button class="mini-ctrl" id="mini-play-btn">
      <svg id="mini-play-icon" width="28" height="28" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="mini-ctrl" id="mini-next-btn">
      <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6h2v12h-2z"/></svg>
    </button>
    <div id="mini-progress"></div>
  </div>

  <!-- bottom nav -->
  <nav id="navbar">
    <button class="nav-btn active" data-page="home">
      <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Home
    </button>
    <button class="nav-btn" data-page="search">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      Search
    </button>
    <button class="nav-btn" data-page="library">
      <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      Library
    </button>
  </nav>

</div>

<!-- now playing panel -->
<div id="now-playing">
  <div id="np-bg"></div>
  <div id="np-overlay"></div>
  <div id="np-content">

    <div id="np-handle"></div>

    <div id="np-topbar">
      <button class="np-topbar-btn" id="np-close-btn">
        <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M19 11H7.83l4.88-4.88c.39-.39.39-1.03 0-1.42-.39-.39-1.02-.39-1.41 0l-6.59 6.59c-.39.39-.39 1.02 0 1.41l6.59 6.59c.39.39 1.02.39 1.41 0 .39-.39.39-1.02 0-1.41L7.83 13H19c.55 0 1-.45 1-1s-.45-1-1-1z"/></svg>
      </button>
      <span class="np-context">Now Playing</span>
      <button class="np-topbar-btn" id="np-share-btn">
        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
      </button>
    </div>

    <div id="np-art-wrap">
      <img id="np-art" src="" alt="" />
    </div>

    <div id="np-info">
      <div id="np-info-row">
        <div>
          <div id="np-title">—</div>
          <div id="np-artist">—</div>
        </div>
        <span id="np-quality-badge" class="quality-badge"></span>
      </div>
    </div>

    <div id="np-progress-wrap">
      <div id="np-progress-bar">
        <div id="np-progress-fill" style="width:0%"></div>
      </div>
      <div class="np-times">
        <span id="np-time-cur">0:00</span>
        <span id="np-time-tot">0:00</span>
      </div>
    </div>

    <div id="np-controls">
      <button class="ctrl-btn" id="shuffle-btn">
        <svg id="shuffle-icon" width="22" height="22" fill="currentColor" viewBox="0 0 24 24" style="opacity:0.35"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </button>
      <button class="ctrl-btn" id="np-prev-btn">
        <svg width="34" height="34" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button class="ctrl-btn" id="np-play-btn">
        <svg id="np-play-icon" width="32" height="32" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl-btn" id="np-next-btn">
        <svg width="34" height="34" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6h2v12h-2z"/></svg>
      </button>
      <button class="ctrl-btn" id="repeat-btn">
        <svg id="repeat-icon" width="22" height="22" fill="currentColor" viewBox="0 0 24 24" style="opacity:0.35"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      </button>
    </div>

    <div id="np-volume">
      <svg class="vol-icon" width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M7 9v6h4l5 5V4l-5 5H7z"/></svg>
      <div id="vol-bar"><div id="vol-fill"></div></div>
      <svg class="vol-icon" width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
    </div>

    <div id="np-queue-wrap">
      <div class="np-queue-label">Up Next</div>
      <div id="np-queue-list"></div>
    </div>

  </div>
</div>

<div id="toast"></div>
<audio id="audio"></audio>

<script src="api.js"></script>
<script src="ui.js"></script>
<script src="player.js"></script>
<script src="app.js"></script>

</body>
</html>
