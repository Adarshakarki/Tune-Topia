<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Music</title>

  <link rel="stylesheet" href="css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
</head>

<body>
  <div id="yt-hidden"><div id="yt-player"></div></div>
  <div class="server-pill" id="pill">⌛ connecting…</div>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-top">
      <div class="brand">♪ <span>Music</span></div>
      <div class="search-box">
        <input id="q" placeholder="Search songs, artists…" />
        <button id="go">⌕</button>
      </div>
    </div>
    <div class="queue-label">Queue</div>
    <div class="track-list" id="list">
      <div class="msg">🎵 Search to fill your queue</div>
    </div>
  </div>

  <!-- NOW PLAYING -->
  <div class="now-playing-area">
    <div id="bg-blur"></div>
    <div class="album-wrap" id="album-wrap">
      <img id="art-img"/>
      <div class="no-art" id="art-ph">♪</div>
    </div>
    <div class="track-meta">
      <div id="meta-title">No track selected</div>
      <div id="meta-ch">Search and pick a song</div>
    </div>
  </div>

  <!-- PLAYER BAR -->
  <div class="player-bar">
    <div class="bar-track">
      <img id="bar-thumb"/>
      <div>
        <div id="bar-title">—</div>
        <div id="bar-ch"></div>
      </div>
    </div>

    <div class="controls">
      <div class="ctrl-btns">
        <button id="btn-prev">⏮</button>
        <button id="btn-play">▶</button>
        <button id="btn-next">⏭</button>
      </div>
      <div class="progress-row">
        <span id="t-cur">0:00</span>
        <div class="prog-bar" id="prog-bar">
          <div class="prog-fill" id="prog-fill"></div>
        </div>
        <span id="t-end">0:00</span>
      </div>
    </div>

    <input type="range" id="vol" min="0" max="100" value="80"/>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
