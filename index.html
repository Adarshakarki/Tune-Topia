<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Topia Tune</title>
  <link rel="icon" type="image/x-icon" href="assets/TopiaTune.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
  <div id="yt-hidden"><div id="yt-player"></div></div>

  <div class="server-pill" id="pill">
    <img src="icons/hourglass.svg" alt="" width="12" height="12"/>
    <span id="pill-text">connecting…</span>
  </div>

  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="assets/TopiaTune.png" alt="Topia Tune" width="28" height="28" style="border-radius:50%"/>
        <span>Topia Tune</span>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-btn" data-page="home">
          <img src="icons/house.svg" alt="" width="18" height="18"/>
          Home
        </button>
        <button class="nav-btn" data-page="search">
          <img src="icons/search.svg" alt="" width="18" height="18"/>
          Search
        </button>
        <button class="nav-btn" data-page="library">
          <img src="icons/library.svg" alt="" width="18" height="18"/>
          Library
        </button>
      </nav>
      <div class="sidebar-divider"></div>
      <div class="queue-label">Up Next</div>
      <div class="track-list" id="queue-list">
        <div class="msg">
          <span class="msg-icon"><img src="icons/casette-tape.svg" alt="" width="24" height="24"/></span>
          Search to fill your queue
        </div>
      </div>
    </aside>

    <main class="main-content" id="content-area">
      <div class="page-loading"><div class="spin"></div></div>
    </main>
  </div>

  <footer class="player-bar">
    <div class="bar-left">
      <img id="bar-thumb" src="" alt=""/>
      <div class="bar-meta">
        <div id="bar-title">—</div>
        <div id="bar-ch"></div>
      </div>
    </div>
    <div class="bar-center">
      <div class="ctrl-btns">
        <button class="ctrl-btn" id="btn-prev" title="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>
        <button class="play-btn" id="btn-play">
          <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="ctrl-btn" id="btn-next" title="Next">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zm2.5-6 5.5 3.9V8.1L8.5 12zM16 6h2v12h-2z"/></svg>
        </button>
      </div>
      <div class="progress-row">
        <span id="t-cur">0:00</span>
        <div class="prog-bar" id="prog-bar">
          <div class="prog-fill" id="prog-fill"></div>
          <div class="prog-thumb" id="prog-thumb"></div>
        </div>
        <span id="t-end">0:00</span>
      </div>
    </div>
    <div class="bar-right">
      <svg class="vol-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      <div class="vol-track">
        <div class="vol-fill" id="vol-fill"></div>
        <input type="range" id="vol" min="0" max="100" value="80"/>
      </div>
    </div>
  </footer>

  <!-- Bottom Navigation (mobile only) -->
  <nav class="bottom-nav" id="bottom-nav">
    <div class="bottom-nav-inner">
      <button class="bottom-nav-btn" data-page="home">
        <img src="icons/house.svg" alt="" width="22" height="22"/>
        Home
      </button>
      <button class="bottom-nav-btn" data-page="search">
        <img src="icons/search.svg" alt="" width="22" height="22"/>
        Search
      </button>
      <button class="bottom-nav-btn" data-page="library">
        <img src="icons/library.svg" alt="" width="22" height="22"/>
        Library
      </button>
    </div>
  </nav>

  <script src="js/api.js"></script>
  <script src="js/player.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/search.js"></script>
  <script src="js/pages/library.js"></script>
  <script src="js/router.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
